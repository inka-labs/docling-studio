[workspace]
name = "docling-studio"
channels = ["conda-forge"]
# No Intel Macs: PyTorch stopped publishing macOS x86_64 wheels, and Docling's models need it.
# macOS 14 Sonoma or later: MLX (the VLM and Whisper models' fast path on Apple silicon) needs it.
platforms = [{ name = "osx-arm64-sonoma", platform = "osx-arm64", macos = "14.0" }, "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = "3.12.*"
nodejs = ">=22"
pytest = ">=8"

[pypi-dependencies]
# Studio's own packages come from PyPI too, so one resolver fits them to Docling's pins (typer,
# websockets): mixing conda and PyPI copies of the same packages doesn't solve.
fastapi = ">=0.115"
uvicorn = ">=0.30"
# docling-serve API keys go into the system keychain (services.py).
keyring = ">=25"
pyyaml = ">=6"
psutil = ">=5.9"
httpx = ">=0.27"
docling-studio = { path = "backend", editable = true }
# Docling with every extra that installs on Mac, Windows and Linux alike: VLM pipeline, ASR (audio),
# EasyOCR / RapidOCR (ONNX on the CPU) OCR engines, remote model APIs, XBRL. Studio reads Docling's own CLI
# (cli_schema.py), so every option of this version shows up in the forms.
docling = { version = ">=2.138", extras = ["vlm", "asr", "easyocr", "rapidocr", "remote-serving", "xbrl"] }
# `docling convert-remote` (a docling-serve service) and video input (frames + speech).
docling-slim = { version = ">=2.138", extras = ["service-client", "format-video"] }
# `doclang validate` checks Schematron rules with Saxon.
doclang = { version = "*", extras = ["schematron-saxon"] }

[target.osx-arm64.pypi-dependencies]
# Apple's Vision framework as an OCR engine (--ocr-engine ocrmac).
ocrmac = ">=1.0"

[tasks]
install-ui = { cmd = "npm install", cwd = "frontend" }
build-ui = { cmd = "npm run build", cwd = "frontend", depends-on = ["install-ui"] }
dev-ui = { cmd = "npm run dev", cwd = "frontend" }
serve = "python -m docling_studio"
start = { depends-on = ["build-ui", "serve"] }
test = { cmd = "pytest -q", cwd = "backend" }
# Start Studio when you log in: pixi run autostart install | uninstall | status
autostart = "python -m docling_studio.autostart"
# Installers for people without a terminal: packaging/dist/*-mac.zip and *-windows.zip (see packaging/README.md)
release = { cmd = "python packaging/build_release.py", depends-on = ["build-ui"] }
